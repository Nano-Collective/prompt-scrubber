name: Changeset Check

# Friendly, NON-BLOCKING nudge: if a pull request changes source but adds no
# changeset, leave a single comment explaining how to add one. If a changeset is
# later added, the comment is removed. This never fails the build - it only
# keeps the release-notes pipeline fed.
#
# The PR's file list is read through the API rather than checked out. This job
# runs as `pull_request_target`, so it carries the base repository's token and
# secrets, and pulling fork code into that trusted context is what leads to
# "pwn request" vulnerabilities. The check only ever needs filenames.

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  changeset-check:
    runs-on: ubuntu-latest
    if: github.head_ref != 'changeset-release/main'
    steps:
      - name: Comment if missing (or clean up if present)
        uses: actions/github-script@v9
        with:
          script: |
            const marker = '<!-- changeset-check -->';
            const {owner, repo} = context.repo;
            const issue_number = context.issue.number;

            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner, repo, pull_number: issue_number,
            });
            const hasChangeset = files.some(f =>
              f.status === 'added' &&
              /^\.changeset\/.+\.md$/.test(f.filename) &&
              f.filename !== '.changeset/README.md'
            );

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number,
            });
            const existing = comments.find(c => c.body && c.body.includes(marker));

            if (hasChangeset) {
              if (existing) {
                await github.rest.issues.deleteComment({owner, repo, comment_id: existing.id});
              }
              return;
            }

            const body = [
              marker,
              "### No changeset found",
              "",
              "This PR does not add a changeset, so it will not appear in the changelog or trigger a release.",
              "",
              "If the change is user-facing, add one:",
              "",
              "```bash",
              "pnpm changeset",
              "```",
              "",
              "Pick a bump (patch / minor / major) and write the changelog entry in our usual voice (\"Added **X**... Closes #123.\"), then commit the generated `.changeset/*.md` file.",
              "",
              "If this PR is docs-only or a chore that needs no release note, you can ignore this - or run `pnpm changeset --empty` to record that intentionally.",
            ].join("\n");

            if (existing) {
              await github.rest.issues.updateComment({owner, repo, comment_id: existing.id, body});
            } else {
              await github.rest.issues.createComment({owner, repo, issue_number, body});
            }
